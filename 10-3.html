<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewport 响应式演示</title>
    <style>
        :root {
            font-size: 16px;
            --bg-1: #f9d7d7;
            --bg-2: #f6d9a8;
            --panel-bg: rgba(255, 255, 255, 0.14);
            --text-color: #ffffff;
            --shadow-color: rgba(82, 51, 44, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: var(--text-color);
            background: #f5f3ef;
        }

        .viewport-box {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            transition: background 0.5s ease;
        }

        .content {
            width: min(80vw, 52rem);
            padding: 2rem 2.5rem;
            border-radius: 1.25rem;
            border: 0.0625rem solid rgba(255, 255, 255, 0.35);
            background: var(--panel-bg);
            backdrop-filter: blur(0.375rem);
            box-shadow: 0 1.25rem 2.5rem var(--shadow-color);
            text-align: center;
        }

        .label {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            letter-spacing: 0.2rem;
            background: rgba(255, 255, 255, 0.18);
            text-transform: uppercase;
        }

        h1 {
            margin: 1rem 0 0.75rem;
            font-size: clamp(2.5rem, 6vw, 6rem);
            line-height: 1.1;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        p {
            font-size: 1.125rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.92);
        }

        @media (max-width: 40rem) {
            :root {
                font-size: 14px;
            }

            .viewport-box {
                background: linear-gradient(135deg, #f6c7bb, #f5dd8a);
            }

            .content {
                width: calc(100vw - 2rem);
                padding: 1.5rem 1.25rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }
        }

        @media (min-width: 40.0625rem) and (max-width: 64rem) {
            .viewport-box {
                background: linear-gradient(135deg, #cfe8ff, #e0f6ff);
            }

            h1 {
                font-size: 3.5rem;
            }
        }

        @media (min-width: 64.0625rem) and (max-width: 90rem) {
            .viewport-box {
                background: linear-gradient(135deg, #ccefd8, #8fc3ff);
            }

            h1 {
                font-size: 4.5rem;
            }
        }

        @media (min-width: 90.0625rem) {
            .viewport-box {
                background: linear-gradient(135deg, #dcd7ff, #ffcbd6);
            }

            .content {
                width: min(70vw, 62rem);
                padding: 2.5rem 3rem;
            }

            h1 {
                font-size: 5.5rem;
            }
        }

        @media (orientation: landscape) and (max-height: 31.25rem) {
            .content {
                padding: 1rem 1.5rem;
            }

            h1 {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="viewport-box">
        <div class="content">
            <div class="label">viewport response</div>
            <h1>苏妍</h1>
            <p>当视口尺寸变化时，背景颜色与文字大小也会随之变化，使用 rem 作为长度单位，让页面在不同设备上保持更自然的比例。</p>
        </div>
    </div>
</body>
</html>
