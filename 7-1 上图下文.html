<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        img{
            display: block;
        }
        .list{
            display: flex; /* 使用flex布局 */
            margin: 20px;
        }
        .list li{
            width: 30%;
            margin-right: 1px;
            flex-grow:1;
            position: relative; /* 设置为相对定位 */
        }
        .list img{
            width: 100%;
        }
        .list p{
            text-align: center; /* 设置文本居中 */
            font-size: 14px;
            line-height: 33px;
            position: absolute; /* 设置为绝对定位 */
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 半透明背景 */
            color: #fff; /* 白色文字 */
        }
    </style>
</head>
<body>
    <ul class = "list">
        <li>
            <img src = "./Images/4.jpg" alt = "图片1">
            <p>图片1</p>
        </li>
        <li>
            <img src = "./Images/5.jpg" alt = "图片2">
            <p>图片2</p>
        </li>
        <li>
            <img src = "./Images/6.jpg" alt = "图片3">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
