<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>926 苏妍</title>
</head>
<body>
    <h2>HTML表单from</h2>
    <form action="https://www.huanqiu.com" method="get">
        <p>
            用户名：<input type="text" name="username">
        </p>
        <p>
            密码：<input type="password" name="password">
        </p>
        <p>
            性别：<input type="radio" name="sex" value="male">男
            <input type="radio" name="sex" value="female">女
            <input type="radio" name="sex" value="secret">保密
        </p>
        <p>
            爱好：<input type="checkbox" name="hobby" value="sing">唱歌
            <input type="checkbox" name="hobby" value="dance">跳舞
            <input type="checkbox" name="hobby" value="draw">画画
        </p>
        <p>
            籍贯：<select name="province">
                <option value="beijing">北京</option>
                <option value="shanghai">上海</option>
                <option value="tianjin">天津</option>
                <option value="chongqing">重庆</option>
            </select>
        </p>
        <p>
            个人简介：<textarea name="introduction" cols="35" rows="7"></textarea>
        </p>
        <p>
            出生日期：<input type="date" name="birthday">
        </p>
        <p>
            多文件上传：<input type="file" name="files" multiple>
        </p>
        <!-- 按钮：普通按钮、提交按钮、重置按钮 -->
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
        </p>
    </form>
    <!-- 按钮 -->
     <button>表单外的按钮</button>
</body>
</html>
