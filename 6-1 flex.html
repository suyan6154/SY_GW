<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 全局初始化：清除默认内外边距，盒模型统一 */
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        /* 外层ul容器，开启flex弹性布局，自动换行，子元素之间产生间距 */
        .flex{
            display: flex;
            flex-wrap: wrap;
            gap:10px;
        }
        /* 每一个li盒子：蓝色边框，宽度49%实现一行两列，弹性布局，内边距让内部方块和边框留出空隙 */
        .flex li{
            border: 1px solid #039;
            width: 49%;
            line-height: 100px;
            list-style: none;
            text-align: center;
            flex-grow: 1;
            display: flex;
            padding:20px;
        }
        /* 第一个li：水平+垂直居中 */
        .flex li:nth-child(1){
            align-items: center;
            justify-content: center;
        }
        /* 第一个面板内部蓝色方块 */
        .box{
            width:50%;
            height: 50%;
            background-color: #039;
        }
        /* 面板内部通用容器，占满整个li，开启flex */
        .panel-inner{
            width:100%;
            height:100%;
            display:flex;
            gap:12px;
        }
        /* 第二个面板：纵向排列，上下两个方块，整体居中 */
        .panel-2{
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }
        .panel-2 .item{
            width: 50%;
            height: 80px;
            border: 1px solid #222;
            background: #e4e4e4;
        }

        /* 第三个面板：2*2四格网格，flex换行，每个item宽度50%减去间隙，一行放2个，自动换行 */
        .panel-3{
            flex-wrap:wrap;
            align-items:center;
            justify-content:center;
        }
        .panel-3 .item{
            width:calc(50% - 6px);
            height:80px;
            border:1px solid #222;
            background:#e4e4e4;
        }
        /* 第四个面板：纵向布局，上方通栏长条，下方两个并排方块 */
        .panel-4{
            flex-direction:column;
            justify-content:center;
        }
        .panel-4 .top{
            width:100%;
            height:80px;
            border:1px solid #222;
            background:#e4e4e4;
        }
        .panel-4 .bottom-wrap{
            display:flex;
            gap:12px;
        }
        .panel-4 .bottom{
            width:calc(50% - 6px);
            height:80px;
            border:1px solid #222;
            background:#e4e4e4;
        }
    </style>
</head>
<body>
    <h2>苏妍 flex</h2>
    <!-- 弹性容器ul，4个li，一行2个 -->
    <ul class = "flex">
        <!-- 第1个面板：单个蓝色矩形 -->
        <li>
            <div class = "box"></div>
        </li>
        <!-- 第2个面板：上下两个灰色矩形 -->
        <li>
            <div class="panel-inner panel-2">
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </li>
        <!-- 第3个面板：2行2列4个方块，flex-wrap换行，一行2个 -->
        <li>
            <div class="panel-inner panel-3">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </li>
        <!-- 第4个面板：顶部通栏长条，下方左右两个方块 -->
        <li>
            <div class="panel-inner panel-4">
                <div class="top"></div>
                <div class="bottom-wrap">
                    <div class="bottom"></div>
                    <div class="bottom"></div>
                </div>
            </div>
        </li>
        <h2>浮动之后</h2>
    </ul>
</body>
</html>
