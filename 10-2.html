<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-2 - 苏妍的幻灯片</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f3f3d2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 幻灯片容器 */
        .slideshow-container {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        /* 单个幻灯片项 */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0; /* 默认隐藏 */
            z-index: 0;
            animation: slideAnimation 9s infinite; /* 总时长9s，3张图每张3s */
        }

        /* 图片区域 - 铺满整个幻灯片 */
        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 文字区域 - 绝对定位在图片底部 */
        .slide-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5); /* 透明黑底 (0.5为透明度，可调整) */
            color: #ffffff; /* 白字 */
            text-align: center;
        }

        .slide-text h2 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slide-text p {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
        }

        /* CSS3 动画关键帧 */
        @keyframes slideAnimation {
            0%    { opacity: 0; z-index: 0; }
            2%    { opacity: 1; z-index: 1; } /* 快速淡入 */
            31%   { opacity: 1; z-index: 1; } /* 停留展示 */
            33%   { opacity: 0; z-index: 0; } /* 快速淡出 */
            100%  { opacity: 0; z-index: 0; } /* 等待其他图展示 */
        }

        /* 为每张幻灯片设置不同的动画延迟时间 */
        .slide:nth-child(1) {
            animation-delay: 0s;
        }

        .slide:nth-child(2) {
            animation-delay: 3s; /* 第1张播3秒后开始 */
        }

        .slide:nth-child(3) {
            animation-delay: 6s; /* 第2张播3秒后开始 */
        }
    </style>
</head>
<body>

    <div class="slideshow-container">
        <!-- 幻灯片 1 -->
        <div class="slide">
            <img src="Images/8.jpg" alt="图片8" class="slide-image">
            <div class="slide-text">
                <h2>苏妍 · 故地重游</h2>
                <p>复古老物件装置装点砖墙，人驻足打卡，重温旧日烟火。</p>
            </div>
        </div>

        <!-- 幻灯片 2 -->
        <div class="slide">
            <img src="Images/9.jpg" alt="图片9" class="slide-image">
            <div class="slide-text">
                <h2>苏妍 · 剧场奇遇</h2>
                <p>童话装扮的演员穿行观众席，和台下观众热情互动，满堂欢悦。</p>
            </div>
        </div>

        <!-- 幻灯片 3 -->
        <div class="slide">
            <img src="Images/12.png" alt="图片12" class="slide-image">
            <div class="slide-text">
                <h2>苏妍 · 入画国风</h2>
                <p>仕女立于画框之中，游人伴画留影，定格国风趣味瞬间。</p>
            </div>
        </div>
    </div>

</body>
</html>
